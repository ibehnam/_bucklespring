name bucklespring
# Key sounds. The daemon claims its own pidfile, owns its log, and rereads its
# settings on SIGHUP; the plugin launches it detached from the tmux server, whose
# terminal lends it the macOS keyboard grant. The icon is this plugin's producer
# in the status daemon, computed from the pidfile's holder, its log, and its
# heartbeat.
producer - bucklespring
menu - b submenu Bucklespring
hint - buckle global @buckle_icon_color Key sounds
icon - #{@buckle_icon_color}
daemon - %CACHE%/tmux-bucklespring/buckle.pid buckle
cache %CACHE%/tmux-bucklespring
cache %CACHE%/tmux/plugin-bucklespring.log
state - @buckle_enabled durable machine bucklespring tmux-option restore flag:0
persist @buckle_gain
persist @buckle_profile
persist @buckle_quiet_from
persist @buckle_quiet_to
volatile - @buckle_icon_color
attach attach
restore restore
lint plugin.sh
